<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>防汛地圖</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden; /* 隱藏捲軸，確保全螢幕體驗 */
    }
    iframe {
      width: 100%;
      height: 100%; /* 預設桌面用滿版 */
      border: none;
      display: block; /* 移除 iframe 預設的底部間隙 */
    }
    /* 手機裝置 (螢幕寬度小於768px) */
    @media (max-width: 768px) {
      iframe {
        height: 90vh; /* 手機用 90vh，避免超出螢幕 */
      }
    }
  </style>
</head>
<body>
  <iframe 
    src="https://script.google.com/macros/s/AKfycbwY5gHMEENh41zXUCAsZrpB3abrPCvTI9rB79fdeaNvk-0jCTLuO87NIlJC0LoituD-wA/exec" 
    frameborder="0" 
    allow="geolocation *; camera; microphone; accelerometer; gyroscope"
    sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-top-navigation">
  </iframe>
</body>
</html>
