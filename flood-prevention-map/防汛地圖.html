    <div id="map"></div>

    <div class="info-panel">
        <div class="info-title">高程比對地圖</div>
        <div class="zoom-row">
            <label for="zoomInput">層級</label>
            <input type="number" id="zoomInput" max="19" value="18" step="1">
            <button type="button" id="applyZoomBtn">套用</button>
        </div>
    </div>

    <div class="layer-panel" id="layerPanel">
        <button type="button" class="layer-toggle" id="layerToggleBtn" aria-expanded="true" title="收合／展開圖層">
            <span><span class="layer-toggle-full">底圖與圖層</span><span class="layer-toggle-short">圖層</span></span>
            <span class="toggle-icon">▼</span>
        </button>
        <div class="layer-panel-body" id="layerPanelBody">
        <h2>底圖</h2>
        <label><input type="radio" name="basemap" value="orthophoto"> 正射影像</label>
        <label><input type="radio" name="basemap" value="osm" checked> 標準地圖</label>
        <label><input type="radio" name="basemap" value="satellite"> 衛星圖</label>
        <h2>套疊圖層</h2>
        <label><input type="checkbox" name="overlay" value="b5000"> 1/5000 基本地形圖</label>
        <label><input type="checkbox" name="overlay" value="water" checked> 水位站（即時）</label>
        <label class="water-sub-option"><input type="checkbox" id="showNormalWater"> 顯示正常水位站</label>
        <label><input type="checkbox" name="overlay" value="camera"> 防汛 CCTV</label>
        <label><input type="checkbox" name="overlay" value="roadCamera"> 道路 CCTV（路況）</label>
        <label><input type="checkbox" name="overlay" value="highwayCamera"> 公路 CCTV（國道／省道）</label>
        <div class="water-legend">
            <div class="water-legend-item"><span class="water-legend-dot" style="background:#1976d2;border-color:#0d47a1"></span>正常</div>
            <div class="water-legend-item"><span class="water-legend-dot" style="background:#f9a825;border-color:#f57f17"></span>行動警戒</div>
            <div class="water-legend-item"><span class="water-legend-dot" style="background:#e65100;border-color:#bf360c"></span>一級警戒</div>
            <div class="water-legend-item"><span class="water-legend-dot" style="background:#b71c1c;border-color:#7f0000"></span>溢堤</div>
        </div>
        </div>
    </div>

    <div class="right-controls">
        <button class="control-button" type="button" id="zoomInBtn">+</button>
        <button class="control-button" type="button" id="zoomOutBtn">−</button>
        <button class="control-button" type="button" id="locBtn" title="定位">📍</button>
    </div>

    <script>
        const TAINAN_CENTER = [23.113, 120.303];
        const DEFAULT_ZOOM = 18;
        const API_BASE = 'https://wrbweb.tainan.gov.tw/TainanApi';
        const API_KEY = '607C505D-A9F5-4D88-B409-94B680C26B3E';
        const REFRESH_INTERVAL_MS = 10 * 60 * 1000;
        const CCTV_IMG_REFRESH_MS = 60 * 1000;
        const ROAD_CCTV_API = 'https://soa.tainan.gov.tw/Api/Service/Get/4cabeb5d-f234-4cdc-a724-0f5fac90b1de';
        const HIGHWAY_CCTV_APIS = {
            freeway: 'https://thbapp.thb.gov.tw/services/cctv/freeway',
            thb: 'https://thbapp.thb.gov.tw/services/cctv/thb',
            county: 'https://thbapp.thb.gov.tw/services/cctv/county'
        };
        const HIGHWAY_MARKER_STYLES = {
            freeway: { fillColor: '#546e7a', color: '#37474f' },
            thb: { fillColor: '#00897b', color: '#00695c' },
            county: { fillColor: '#546e7a', color: '#37474f' }
        };
        const HIGHWAY_SOURCE_LABELS = {
            freeway: '國道',
            thb: '省道',
            county: '縣市'
        };
        const LABEL_MIN_ZOOM = 14;
        const COORD_DECIMALS = 6;

        // 大台南圍籬：北嘉義布袋、南高雄永安、東玉山、西澎湖
        const TAINAN_REGION_BOUNDS = {
            latMin: 22.818,
            latMax: 23.378,
            lngMin: 119.566,
            lngMax: 120.957
        };

        function isInTainanRegion(lat, lng) {
            if (lat == null || lng == null) return false;
            if (lat === 0 && lng === 0) return false;
            const b = TAINAN_REGION_BOUNDS;
            return lat >= b.latMin && lat <= b.latMax &&
                lng >= b.lngMin && lng <= b.lngMax;
        }

        function logOutOfRegion(type, rejected) {
            if (!rejected.length) return;
            console.warn(
                '[' + type + '] 座標超出大台南圍籬，已略過 ' + rejected.length + ' 筆：',
                rejected
            );
        }

        function normalizeCoord(value) {
            const n = Number(value);
            if (Number.isNaN(n)) return null;
            const factor = Math.pow(10, COORD_DECIMALS);
            return Math.trunc(n * factor) / factor;
        }

        function formatCoord(value) {
            const n = normalizeCoord(value);
            return n == null ? null : n.toFixed(COORD_DECIMALS);
        }

        function buildGoogleMapsUrl(lat, lng) {
            return 'https://www.google.com/maps/place/' + formatCoord(lat) + ',' + formatCoord(lng);
        }

        function buildMapsLinkHtml(lat, lng) {
            const url = buildGoogleMapsUrl(lat, lng);
            const coords = formatCoord(lat) + ',' + formatCoord(lng);
            return (
                '<div class="maps-link-row">' +
                '<a class="maps-icon-link" href="' + url + '" target="_blank" rel="noopener noreferrer" title="' + coords + '">' +
                '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
                '<path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/>' +
                '</svg></a>' +
                '<button type="button" class="maps-copy-btn" data-maps-url="' + url + '">複製網址</button>' +
                '</div>'
            );
        }

        function copyMapsUrl(btn) {
            const url = btn.getAttribute('data-maps-url');
            if (!url) return;
            const done = () => {
                const orig = btn.textContent;
                btn.textContent = '已複製';
                setTimeout(() => { btn.textContent = orig; }, 1500);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(done).catch(() => {
                    fallbackCopy(url);
                    done();
                });
            } else {
                fallbackCopy(url);
                done();
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
        }

        function clusterRadiusForZoom(zoom, radiusBelow) {
            return zoom >= LABEL_MIN_ZOOM ? 0 : radiusBelow;
        }

        const CLUSTER_OPTIONS = {
            spiderfyOnMaxZoom: true,
            showCoverageOnHover: false,
            zoomToBoundsOnClick: true,
            spiderfyDistanceMultiplier: 2,
            animate: true,
            animateAddingMarkers: false,
            maxClusterRadius: function (zoom) { return clusterRadiusForZoom(zoom, 50); },
            disableClusteringAtZoom: 20,
            spiderLegPolylineOptions: { weight: 1.5, color: '#555', opacity: 0.65 }
        };

        const map = L.map('map', {
            center: TAINAN_CENTER,
            zoom: DEFAULT_ZOOM,
            maxZoom: 19,
            zoomControl: false
        });

        const baseMaps = {
            orthophoto: L.tileLayer.wms('https://wms.nlsc.gov.tw/wms', {
                layers: 'PHOTO_MIX',
                format: 'image/jpeg',
                transparent: false,
                uppercase: true,
                attribution: '© 內政部國土測繪中心'
            }),
            osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }),
            satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: '© Esri'
            })
        };

        const overlayLayers = {
            b5000: L.tileLayer('https://wmts.nlsc.gov.tw/wmts/B5000/default/GoogleMapsCompatible/{z}/{y}/{x}', {
                opacity: 0.92,
                maxZoom: 18,
                attribution: '© 內政部國土測繪中心 — 1/5000基本地形圖'
            })
        };

        const zoomInput = document.getElementById('zoomInput');
        let currentBase = baseMaps.osm;
        const activeOverlays = {};
        const waterLayer = L.markerClusterGroup(CLUSTER_OPTIONS);
        const cameraLayer = L.markerClusterGroup({
            ...CLUSTER_OPTIONS,
            maxClusterRadius: function (zoom) { return clusterRadiusForZoom(zoom, 45); }
        });
        const roadCameraLayer = L.markerClusterGroup({
            ...CLUSTER_OPTIONS,
            maxClusterRadius: function (zoom) { return clusterRadiusForZoom(zoom, 45); }
        });
        const highwayCameraLayer = L.markerClusterGroup({
            ...CLUSTER_OPTIONS,
            maxClusterRadius: function (zoom) { return clusterRadiusForZoom(zoom, 45); }
        });
        let waterLayerOnMap = false;
        let cameraLayerOnMap = false;
        let roadCameraLayerOnMap = false;
        let highwayCameraLayerOnMap = false;
        let waterStationRecords = [];
        let cameraRecords = [];
        let roadCameraRecords = [];
        let highwayCameraRecords = [];
        let waterInitialFitDone = false;
        let cameraInitialFitDone = false;
        let roadCameraInitialFitDone = false;
        let highwayCameraInitialFitDone = false;
        let cameraDataLoaded = false;
        let roadCameraDataLoaded = false;
        let highwayCameraDataLoaded = false;
        let popupImgTimer = null;

        currentBase.addTo(map);

        function clampZoom(z) {
            const n = Math.round(Number(z) || DEFAULT_ZOOM);
            return Math.min(map.getMaxZoom(), Math.max(map.getMinZoom(), n));
        }

        function bindStationLabel(marker, text, side) {
            marker.bindTooltip(text, {
                permanent: true,
                direction: side,
                className: 'station-label',
                opacity: 1,
                offset: side === 'right' ? [6, 0] : [-6, 0]
            });
        }

        function formatWaterLevelLabel(waterLevel) {
            if (!isValidThreshold(waterLevel)) return '水位EL.—';
            return '水位EL.' + Number(waterLevel).toFixed(2) + 'm';
        }

        function bindWaterStationLabels(marker, station, info) {
            bindStationLabel(marker, station.StationName, 'right');
            marker._levelTooltip = L.tooltip({
                permanent: true,
                direction: 'left',
                className: 'station-label',
                opacity: 1,
                offset: [-6, 0]
            }).setContent(formatWaterLevelLabel(info.WaterLevel));
            marker.on('move', () => {
                if (marker._levelTooltip && marker._map && marker._map.hasLayer(marker._levelTooltip)) {
                    marker._levelTooltip.setLatLng(marker.getLatLng());
                }
            });
        }

        function setLevelTooltipVisible(marker, visible) {
            if (!marker._levelTooltip || !marker._map) return;
            const onMap = marker._map.hasLayer(marker._levelTooltip);
            if (visible && !onMap) {
                marker._levelTooltip.setLatLng(marker.getLatLng()).addTo(marker._map);
            } else if (!visible && onMap) {
                marker._map.removeLayer(marker._levelTooltip);
            }
        }

        function isClusterLayer(layer) {
            return layer && typeof layer.getAllChildMarkers === 'function';
        }

        function updateMarkerLabels() {
            const show = map.getZoom() >= LABEL_MIN_ZOOM;
            [waterLayer, cameraLayer, roadCameraLayer, highwayCameraLayer].forEach(layer => {
                layer.eachLayer(marker => {
                    if (isClusterLayer(marker)) return;
                    const tip = marker.getTooltip();
                    if (tip) {
                        if (show) marker.openTooltip();
                        else marker.closeTooltip();
                    }
                    setLevelTooltipVisible(marker, show);
                });
            });
        }

        function refreshMarkerClusters() {
            [waterLayer, cameraLayer, roadCameraLayer, highwayCameraLayer].forEach(layer => {
                if (layer._map && layer._topClusterLevel && layer.refreshClusters) {
                    layer.refreshClusters();
                }
            });
        }

        function setWaterStatus(text, type) {
            if (type === 'error') console.error('[水位站]', text);
            else console.log('[水位站]', text);
        }

        function setCameraStatus(text, type) {
            if (type === 'error') console.error('[CCTV]', text);
            else console.log('[CCTV]', text);
        }

        function setRoadCameraStatus(text, type) {
            if (type === 'error') console.error('[道路CCTV]', text);
            else console.log('[道路CCTV]', text);
        }

        function setHighwayCameraStatus(text, type) {
            if (type === 'error') console.error('[公路CCTV]', text);
            else console.log('[公路CCTV]', text);
        }

        function clearPopupImgTimer() {
            if (popupImgTimer) {
                clearInterval(popupImgTimer);
                popupImgTimer = null;
            }
        }

        function captureOpenPopup() {
            const popup = map._popup;
            if (!popup || !popup.isOpen()) return null;
            const src = popup._source;
            if (src && src._cameraId) return { type: 'camera', id: src._cameraId };
            if (src && src._roadCameraUrl) return { type: 'roadCamera', id: src._roadCameraUrl };
            if (src && src._highwayCameraId) return { type: 'highwayCamera', id: src._highwayCameraId };
            if (src && src._waterStationId) return { type: 'water', id: src._waterStationId };
            return null;
        }

        function restoreOpenPopup(state) {
            if (!state) return;
            const layerMap = {
                camera: cameraLayer,
                roadCamera: roadCameraLayer,
                highwayCamera: highwayCameraLayer,
                water: waterLayer
            };
            const layer = layerMap[state.type];
            if (!layer) return;
            layer.eachLayer(marker => {
                if (isClusterLayer(marker)) return;
                let match = false;
                if (state.type === 'camera') match = marker._cameraId === state.id;
                else if (state.type === 'roadCamera') match = marker._roadCameraUrl === state.id;
                else if (state.type === 'highwayCamera') match = marker._highwayCameraId === state.id;
                else if (state.type === 'water') match = marker._waterStationId === state.id;
                if (match) marker.openPopup();
            });
        }

        function bringOverlaysToFront() {
            Object.values(activeOverlays).forEach(layer => layer.bringToFront());
            if (waterLayerOnMap && waterLayer.bringToFront) waterLayer.bringToFront();
            if (cameraLayerOnMap && cameraLayer.bringToFront) cameraLayer.bringToFront();
            if (roadCameraLayerOnMap && roadCameraLayer.bringToFront) roadCameraLayer.bringToFront();
            if (highwayCameraLayerOnMap && highwayCameraLayer.bringToFront) highwayCameraLayer.bringToFront();
        }

        function toggleWaterLayer(active) {
            if (active && !waterLayerOnMap) {
                waterLayer.addTo(map);
                waterLayerOnMap = true;
            } else if (!active && waterLayerOnMap) {
                map.removeLayer(waterLayer);
                waterLayerOnMap = false;
            }
            bringOverlaysToFront();
        }

        async function toggleCameraLayer(active) {
            if (active) {
                if (!cameraDataLoaded) await loadCameras();
                if (!cameraLayerOnMap) {
                    cameraLayer.addTo(map);
                    cameraLayerOnMap = true;
                    if (!cameraInitialFitDone) {
                        try {
                            const bounds = cameraLayer.getBounds();
                            if (bounds.isValid()) {
                                map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
                                cameraInitialFitDone = true;
                            }
                        } catch (e) { /* cluster 尚未就緒時略過 */ }
                    }
                }
            } else if (cameraLayerOnMap) {
                map.removeLayer(cameraLayer);
                cameraLayerOnMap = false;
            }
            if (cameraRecords.length) {
                setCameraStatus(
                    'CCTV：' + cameraRecords.length + ' 支（' + (cameraLayerOnMap ? '顯示中' : '已隱藏') + '）',
                    'ok'
                );
            }
            bringOverlaysToFront();
        }

        async function toggleRoadCameraLayer(active) {
            if (active) {
                if (!roadCameraDataLoaded) await loadRoadCameras();
                if (!roadCameraLayerOnMap) {
                    roadCameraLayer.addTo(map);
                    roadCameraLayerOnMap = true;
                    if (!roadCameraInitialFitDone) {
                        try {
                            const bounds = roadCameraLayer.getBounds();
                            if (bounds.isValid()) {
                                map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
                                roadCameraInitialFitDone = true;
                            }
                        } catch (e) { /* cluster 尚未就緒時略過 */ }
                    }
                }
            } else if (roadCameraLayerOnMap) {
                map.removeLayer(roadCameraLayer);
                roadCameraLayerOnMap = false;
            }
            if (roadCameraRecords.length) {
                setRoadCameraStatus(
                    '道路 CCTV：' + roadCameraRecords.length + ' 支（' + (roadCameraLayerOnMap ? '顯示中' : '已隱藏') + '）',
                    'ok'
                );
            }
            bringOverlaysToFront();
        }

        async function toggleHighwayCameraLayer(active) {
            if (active) {
                if (!highwayCameraDataLoaded) await loadHighwayCameras();
                if (!highwayCameraLayerOnMap) {
                    highwayCameraLayer.addTo(map);
                    highwayCameraLayerOnMap = true;
                    if (!highwayCameraInitialFitDone) {
                        try {
                            const bounds = highwayCameraLayer.getBounds();
                            if (bounds.isValid()) {
                                map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
                                highwayCameraInitialFitDone = true;
                            }
                        } catch (e) { /* cluster 尚未就緒時略過 */ }
                    }
                }
            } else if (highwayCameraLayerOnMap) {
                map.removeLayer(highwayCameraLayer);
                highwayCameraLayerOnMap = false;
            }
            if (highwayCameraRecords.length) {
                setHighwayCameraStatus(
                    '公路 CCTV：' + highwayCameraRecords.length + ' 支（' + (highwayCameraLayerOnMap ? '顯示中' : '已隱藏') + '）',
                    'ok'
                );
            }
            bringOverlaysToFront();
        }

        async function toggleOverlay(name, active) {
            if (name === 'water') {
                toggleWaterLayer(active);
                return;
            }
            if (name === 'camera') {
                await toggleCameraLayer(active);
                return;
            }
            if (name === 'roadCamera') {
                await toggleRoadCameraLayer(active);
                return;
            }
            if (name === 'highwayCamera') {
                await toggleHighwayCameraLayer(active);
                return;
            }
            if (active) {
                if (!activeOverlays[name]) {
                    activeOverlays[name] = overlayLayers[name];
                    activeOverlays[name].addTo(map);
                }
            } else if (activeOverlays[name]) {
                map.removeLayer(activeOverlays[name]);
                delete activeOverlays[name];
            }
            bringOverlaysToFront();
        }

        async function apiFetch(path) {
            const res = await fetch(API_BASE + path, { headers: { apiKey: API_KEY } });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        }

        function formatLevel(value, unit) {
            if (!isValidThreshold(value)) return null;
            return Number(value).toFixed(2) + (unit || '');
        }

        const WATER_STATUS_LABELS = {
            normal: '正常',
            mobile: '行動警戒',
            level1: '一級警戒',
            overflow: '溢堤'
        };

        const WATER_MARKER_STYLES = {
            normal: { fillColor: '#1976d2', color: '#0d47a1' },
            mobile: { fillColor: '#f9a825', color: '#f57f17' },
            level1: { fillColor: '#e65100', color: '#bf360c' },
            overflow: { fillColor: '#b71c1c', color: '#7f0000' }
        };

        function isValidThreshold(v) {
            return v != null && v > -900;
        }

        function isValidTopLine(v) {
            return isValidThreshold(v) && v > 0;
        }

        function getStationSource(id) {
            if (id.startsWith('W')) return '臺南市政府';
            if (id.includes('H')) return '水利署';
            return '—';
        }

        function getWaterAlertStatus(station, waterLevel) {
            const w = station.WarningWaterLevel || {};
            const wl = Number(waterLevel);
            const exceeded = {
                mobile: isValidThreshold(w.MobileLevel) && wl >= w.MobileLevel,
                level1: isValidThreshold(w.Level1) && wl >= w.Level1,
                topLine: isValidTopLine(station.TopLine) && wl >= station.TopLine
            };
            let status = 'normal';
            if (exceeded.topLine) status = 'overflow';
            else if (exceeded.level1) status = 'level1';
            else if (exceeded.mobile) status = 'mobile';
            return { status, exceeded };
        }

        function hasAnyValidThreshold(station) {
            const w = station.WarningWaterLevel || {};
            return isValidThreshold(w.MobileLevel) || isValidThreshold(w.Level1) ||
                isValidThreshold(w.Level2) || isValidThreshold(w.Level3) || isValidTopLine(station.TopLine);
        }

        function thresholdLine(label, value, unit, isExceeded) {
            const formatted = formatLevel(value, unit);
            if (!formatted) return null;
            return label + '：' + formatted + (isExceeded ? '（已超過）' : '');
        }

        function createStationIcon(fillColor, borderColor, diameter) {
            return L.divIcon({
                className: 'station-dot-icon',
                iconSize: [diameter, diameter],
                iconAnchor: [diameter / 2, diameter / 2],
                html: '<span class="station-dot" style="width:' + diameter + 'px;height:' + diameter +
                    'px;background:' + fillColor + ';border-color:' + borderColor + '"></span>'
            });
        }

        function buildWaterPopup(station, info, lat, lng) {
            const alert = getWaterAlertStatus(station, info.WaterLevel);
            const w = station.WarningWaterLevel || {};
            const lines = [
                '<strong>' + station.StationName + '</strong> [' + WATER_STATUS_LABELS[alert.status] + ']',
                '測站來源：' + getStationSource(station.StationID),
                '站碼：' + station.StationID,
                '即時水位：' + formatLevel(info.WaterLevel, ' m'),
                '觀測時間：' + (info.InfoTime || '—')
            ];
            const topLine = thresholdLine('堤頂高度', station.TopLine, ' m', alert.exceeded.topLine);
            if (topLine) lines.push(topLine);
            const mob = thresholdLine('行動警戒', w.MobileLevel, ' m', alert.exceeded.mobile);
            if (mob) lines.push(mob);
            const l1 = thresholdLine('一級警戒', w.Level1, ' m', alert.exceeded.level1);
            if (l1) lines.push(l1);
            const l2 = thresholdLine('二級警戒', w.Level2, ' m', false);
            if (l2) lines.push(l2);
            const l3 = thresholdLine('三級警戒', w.Level3, ' m', false);
            if (l3) lines.push(l3);
            if (!hasAnyValidThreshold(station)) lines.push('（未設定警戒門檻）');
            lines.push(buildMapsLinkHtml(lat, lng));
            return lines.join('<br>');
        }

        async function loadWaterStations(options = {}) {
            const silent = options.silent === true;
            if (!silent) setWaterStatus('水位站載入中…');
            try {
                const [stations, realtime] = await Promise.all([
                    apiFetch('/Water/Stations'),
                    apiFetch('/Water/Infos/Realtime')
                ]);
                const stationMap = new Map(stations.map(s => [s.StationID, s]));
                waterStationRecords = [];
                const rejectedWater = [];

                for (const info of realtime) {
                    const station = stationMap.get(info.StationID);
                    if (!station || !station.Point) continue;
                    const lat = normalizeCoord(station.Point.Latitude);
                    const lng = normalizeCoord(station.Point.Longitude);
                    if (lat == null || lng == null) continue;
                    if (!isInTainanRegion(lat, lng)) {
                        rejectedWater.push({
                            stationId: station.StationID,
                            name: station.StationName,
                            lat: formatCoord(lat),
                            lng: formatCoord(lng)
                        });
                        continue;
                    }
                    waterStationRecords.push({
                        station,
                        info,
                        alert: getWaterAlertStatus(station, info.WaterLevel),
                        lat,
                        lng
                    });
                }
                logOutOfRegion('水位站', rejectedWater);

                const shouldInitialFit = !silent && !waterInitialFitDone &&
                    document.querySelector('input[name="overlay"][value="water"]').checked;

                if (!silent && document.querySelector('input[name="overlay"][value="water"]').checked) {
                    toggleWaterLayer(true);
                }

                renderWaterStations({ silent, initialFit: shouldInitialFit });
                if (shouldInitialFit) waterInitialFitDone = true;
                if (waterLayerOnMap) {
                    requestAnimationFrame(() => {
                        refreshMarkerClusters();
                        updateMarkerLabels();
                    });
                }
            } catch (err) {
                if (!silent) setWaterStatus('水位站載入失敗：' + err.message, 'error');
            }
        }

        function renderWaterStations(options = {}) {
            const silent = options.silent === true;
            const savedPopup = silent ? captureOpenPopup() : null;
            const showNormal = document.getElementById('showNormalWater').checked;
            waterLayer.clearLayers();

            const stats = { normal: 0, mobile: 0, level1: 0, overflow: 0 };
            let displayed = 0;

            for (const rec of waterStationRecords) {
                stats[rec.alert.status]++;
                if (rec.alert.status === 'normal' && !showNormal) continue;

                const style = WATER_MARKER_STYLES[rec.alert.status];
                const marker = L.marker([rec.lat, rec.lng], {
                    icon: createStationIcon(style.fillColor, style.color, 12),
                    bubblingMouseEvents: false
                }).bindPopup(buildWaterPopup(rec.station, rec.info, rec.lat, rec.lng));
                marker._waterStationId = rec.station.StationID;
                bindWaterStationLabels(marker, rec.station, rec.info);
                marker.addTo(waterLayer);
                displayed++;
            }

            if (options.initialFit && displayed > 0 && waterLayerOnMap) {
                try {
                    const bounds = waterLayer.getBounds();
                    if (bounds.isValid()) {
                        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
                    }
                } catch (e) { /* cluster 尚未就緒時略過 */ }
            }

            const total = waterStationRecords.length;
            setWaterStatus(
                '水位站：顯示 ' + displayed + '／' + total + ' 站（正常 ' + stats.normal +
                '／行動 ' + stats.mobile + '／一級 ' + stats.level1 +
                '／溢堤 ' + stats.overflow + '）',
                'ok'
            );
            restoreOpenPopup(savedPopup);
            if (waterLayer._map && waterLayer._topClusterLevel) {
                updateMarkerLabels();
            }
        }

        function imageUrlWithCacheBuster(url) {
            const sep = url.indexOf('?') >= 0 ? '&' : '?';
            return url + sep + 't=' + Date.now();
        }

        function buildLazyCctvPopup(title, subtitle, streamUrl, lat, lng) {
            const safeUrl = streamUrl || '#';
            return (
                '<strong>' + title + '</strong><br>' +
                (subtitle ? subtitle + '<br>' : '') +
                '<a class="cctv-open-link" href="' + safeUrl + '" target="_blank" rel="noopener noreferrer">在新分頁開啟影像</a><br>' +
                '<img class="cctv-img" src="" alt="即時影像" ' +
                'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'">' +
                '<span class="cctv-img-error" style="display:none">影像載入失敗</span>' +
                buildMapsLinkHtml(lat, lng)
            );
        }

        function refreshLazyCctvImg(marker, imageUrl) {
            const el = marker.getPopup() && marker.getPopup().getElement();
            if (!el) return;
            const img = el.querySelector('.cctv-img');
            const err = el.querySelector('.cctv-img-error');
            const link = el.querySelector('.cctv-open-link');
            if (!img) return;
            if (!imageUrl) {
                img.removeAttribute('src');
                img.style.display = 'none';
                if (err) err.style.display = 'block';
                return;
            }
            img.style.display = '';
            if (err) err.style.display = 'none';
            const freshUrl = imageUrlWithCacheBuster(imageUrl);
            img.src = freshUrl;
            if (link) link.href = freshUrl;
        }

        function clearLazyCctvImg(marker) {
            clearPopupImgTimer();
            const el = marker.getPopup() && marker.getPopup().getElement();
            if (!el) return;
            const img = el.querySelector('.cctv-img');
            const err = el.querySelector('.cctv-img-error');
            if (img) {
                img.removeAttribute('src');
                img.style.display = 'none';
            }
            if (err) err.style.display = 'none';
        }

        function bindLazyCctvMarker(marker, getStreamUrl) {
            marker.on('popupopen', () => {
                clearPopupImgTimer();
                refreshLazyCctvImg(marker, getStreamUrl());
                popupImgTimer = setInterval(() => {
                    refreshLazyCctvImg(marker, getStreamUrl());
                }, CCTV_IMG_REFRESH_MS);
            });
            marker.on('popupclose', () => clearLazyCctvImg(marker));
        }

        function bindCameraMarker(marker, camera) {
            marker._cameraId = camera.CameraID;
            bindLazyCctvMarker(marker, () => {
                const rec = cameraRecords.find(r => r.camera.CameraID === camera.CameraID);
                return rec ? rec.camera.ImageUrl : camera.ImageUrl;
            });
        }

        function bindRoadCameraMarker(marker, item) {
            marker._roadCameraUrl = item.url;
            bindLazyCctvMarker(marker, () => {
                const rec = roadCameraRecords.find(r => r.roadCamera.url === item.url);
                return rec ? rec.roadCamera.url : item.url;
            });
        }

        function bindHighwayCameraMarker(marker, item) {
            marker._highwayCameraId = item.source + ':' + item.id;
            bindLazyCctvMarker(marker, () => {
                const rec = highwayCameraRecords.find(r =>
                    r.highwayCamera.source === item.source && r.highwayCamera.id === item.id);
                return rec ? rec.highwayCamera.html : item.html;
            });
        }

        async function loadCameras(options = {}) {
            const silent = options.silent === true;
            if (!silent) setCameraStatus('CCTV 載入中…');
            try {
                const [cameras, groupStations] = await Promise.all([
                    apiFetch('/Camera/Infos/Realtime'),
                    apiFetch('/Camera/Stations/GroupStations')
                ]);
                const groupStationMap = new Map(
                    groupStations
                        .filter(s => s.Point && s.Point.Latitude != null && s.Point.Longitude != null)
                        .map(s => [s.StationID, s.Point])
                );
                cameraRecords = [];
                const rejectedCamera = [];

                for (const camera of cameras) {
                    if (!camera.ImageUrl) continue;
                    const point = groupStationMap.get(camera.GroupStationID) || camera.Point;
                    if (!point) continue;
                    const lat = normalizeCoord(point.Latitude);
                    const lng = normalizeCoord(point.Longitude);
                    if (lat == null || lng == null) continue;
                    if (!isInTainanRegion(lat, lng)) {
                        rejectedCamera.push({
                            cameraId: camera.CameraID,
                            name: camera.CameraName,
                            groupStationId: camera.GroupStationID,
                            coordSource: groupStationMap.has(camera.GroupStationID) ? 'GroupStations' : 'Realtime',
                            lat: formatCoord(lat),
                            lng: formatCoord(lng)
                        });
                        continue;
                    }
                    cameraRecords.push({ camera, lat, lng });
                }
                logOutOfRegion('CCTV', rejectedCamera);
                cameraDataLoaded = true;

                renderCameras({ silent });
            } catch (err) {
                if (!silent) setCameraStatus('CCTV 載入失敗：' + err.message, 'error');
            }
        }

        function renderCameras(options = {}) {
            const silent = options.silent === true;
            const savedPopup = silent ? captureOpenPopup() : null;
            cameraLayer.clearLayers();

            for (const rec of cameraRecords) {
                const marker = L.marker([rec.lat, rec.lng], {
                    icon: createStationIcon('#1a0066', '#0d0033', 11),
                    bubblingMouseEvents: false
                }).bindPopup(buildLazyCctvPopup(
                    rec.camera.CameraName,
                    '攝影機：' + rec.camera.CameraID,
                    rec.camera.ImageUrl,
                    rec.lat,
                    rec.lng
                ));
                bindCameraMarker(marker, rec.camera);
                bindStationLabel(marker, rec.camera.CameraName, 'left');
                marker.addTo(cameraLayer);
            }

            const visible = cameraLayerOnMap ? '顯示中' : '已隱藏';
            setCameraStatus('CCTV：' + cameraRecords.length + ' 支（' + visible + '）', 'ok');
            restoreOpenPopup(savedPopup);
            if (cameraLayer._map && cameraLayer._topClusterLevel) {
                updateMarkerLabels();
            }
        }

        async function loadRoadCameras(options = {}) {
            const silent = options.silent === true;
            if (!silent) setRoadCameraStatus('道路 CCTV 載入中…');
            try {
                const res = await fetch(ROAD_CCTV_API);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const json = await res.json();
                const items = Array.isArray(json.data) ? json.data : [];
                roadCameraRecords = [];
                const rejectedRoad = [];

                for (const item of items) {
                    if (!item.url) continue;
                    const lat = normalizeCoord(item.wgsy);
                    const lng = normalizeCoord(item.wgsx);
                    if (lat == null || lng == null) continue;
                    if (!isInTainanRegion(lat, lng)) {
                        rejectedRoad.push({
                            location: item.Location,
                            url: item.url,
                            lat: formatCoord(lat),
                            lng: formatCoord(lng)
                        });
                        continue;
                    }
                    roadCameraRecords.push({ roadCamera: item, lat, lng });
                }
                logOutOfRegion('道路CCTV', rejectedRoad);
                roadCameraDataLoaded = true;

                renderRoadCameras({ silent });
            } catch (err) {
                if (!silent) setRoadCameraStatus('道路 CCTV 載入失敗：' + err.message, 'error');
            }
        }

        function renderRoadCameras(options = {}) {
            const silent = options.silent === true;
            const savedPopup = silent ? captureOpenPopup() : null;
            roadCameraLayer.clearLayers();

            for (const rec of roadCameraRecords) {
                const marker = L.marker([rec.lat, rec.lng], {
                    icon: createStationIcon('#9575cd', '#7e57c2', 10),
                    bubblingMouseEvents: false
                }).bindPopup(buildLazyCctvPopup(rec.roadCamera.Location, '', rec.roadCamera.url, rec.lat, rec.lng));
                bindRoadCameraMarker(marker, rec.roadCamera);
                marker.addTo(roadCameraLayer);
            }

            const visible = roadCameraLayerOnMap ? '顯示中' : '已隱藏';
            setRoadCameraStatus('道路 CCTV：' + roadCameraRecords.length + ' 支（' + visible + '）', 'ok');
            restoreOpenPopup(savedPopup);
            if (roadCameraLayer._map && roadCameraLayer._topClusterLevel) {
                updateMarkerLabels();
            }
        }

        async function fetchHighwayApiJson(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        }

        async function loadHighwaySourceData(source, url) {
            try {
                const data = await fetchHighwayApiJson(url);
                return {
                    items: (Array.isArray(data) ? data : []).map(item => ({ ...item, source })),
                    fromBundle: false
                };
            } catch (err) {
                console.warn('[公路CCTV] ' + source + ' API 無法直連，改用手本快取：', err.message);
                if (window.HIGHWAY_CCTV_BUNDLED && window.HIGHWAY_CCTV_BUNDLED[source]) {
                    return {
                        items: window.HIGHWAY_CCTV_BUNDLED[source].map(item => ({ ...item, source })),
                        fromBundle: true
                    };
                }
                return { items: [], fromBundle: false };
            }
        }

        async function loadHighwayCameras(options = {}) {
            const silent = options.silent === true;
            if (!silent) setHighwayCameraStatus('公路 CCTV 載入中…');
            try {
                const entries = Object.entries(HIGHWAY_CCTV_APIS);
                const batches = await Promise.all(
                    entries.map(([source, url]) => loadHighwaySourceData(source, url))
                );
                highwayCameraRecords = [];
                const rejectedHighway = [];
                let usedBundled = false;

                for (const batch of batches) {
                    if (batch.fromBundle) usedBundled = true;
                    for (const item of batch.items) {
                        if (!item.html) continue;
                        const lat = normalizeCoord(item.gisy);
                        const lng = normalizeCoord(item.gisx);
                        if (lat == null || lng == null) continue;
                        if (!isInTainanRegion(lat, lng)) {
                            rejectedHighway.push({
                                id: item.id,
                                source: item.source,
                                name: item.stakenumber,
                                lat: formatCoord(lat),
                                lng: formatCoord(lng)
                            });
                            continue;
                        }
                        highwayCameraRecords.push({
                            highwayCamera: {
                                id: item.id,
                                source: item.source,
                                stakenumber: item.stakenumber,
                                html: item.html
                            },
                            lat,
                            lng
                        });
                    }
                }
                logOutOfRegion('公路CCTV', rejectedHighway);
                highwayCameraDataLoaded = true;

                renderHighwayCameras({ silent });
                if (usedBundled) {
                    setHighwayCameraStatus(
                        '公路 CCTV：' + highwayCameraRecords.length + ' 支（本機快取，THB API 不支援瀏覽器 CORS）',
                        'ok'
                    );
                }
            } catch (err) {
                if (!silent) setHighwayCameraStatus('公路 CCTV 載入失敗：' + err.message, 'error');
            }
        }

        function renderHighwayCameras(options = {}) {
            const silent = options.silent === true;
            const savedPopup = silent ? captureOpenPopup() : null;
            highwayCameraLayer.clearLayers();

            for (const rec of highwayCameraRecords) {
                const item = rec.highwayCamera;
                const style = HIGHWAY_MARKER_STYLES[item.source] || HIGHWAY_MARKER_STYLES.freeway;
                const sourceLabel = HIGHWAY_SOURCE_LABELS[item.source] || item.source;
                const marker = L.marker([rec.lat, rec.lng], {
                    icon: createStationIcon(style.fillColor, style.color, 10),
                    bubblingMouseEvents: false
                }).bindPopup(buildLazyCctvPopup(
                    item.stakenumber,
                    sourceLabel + ' · ' + item.id,
                    item.html,
                    rec.lat,
                    rec.lng
                ));
                bindHighwayCameraMarker(marker, item);
                marker.addTo(highwayCameraLayer);
            }

            const visible = highwayCameraLayerOnMap ? '顯示中' : '已隱藏';
            setHighwayCameraStatus('公路 CCTV：' + highwayCameraRecords.length + ' 支（' + visible + '）', 'ok');
            restoreOpenPopup(savedPopup);
            if (highwayCameraLayer._map && highwayCameraLayer._topClusterLevel) {
                updateMarkerLabels();
            }
        }

        async function refreshMapDataSilently() {
            await loadWaterStations({ silent: true });
            if (cameraDataLoaded) await loadCameras({ silent: true });
        }

        function startPeriodicRefresh() {
            setInterval(refreshMapDataSilently, REFRESH_INTERVAL_MS);
        }

        function applyZoomFromInput() {
            const z = clampZoom(Number(zoomInput.value) || DEFAULT_ZOOM);
            zoomInput.value = z;
            map.setView(map.getCenter(), z, { animate: true });
        }

        function syncInputFromMap() {
            zoomInput.value = map.getZoom();
        }

        function switchBase(type) {
            if (currentBase) map.removeLayer(currentBase);
            currentBase = baseMaps[type];
            if (currentBase) {
                currentBase.addTo(map);
                bringOverlaysToFront();
            }
        }

        function getLocation() {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(
                pos => {
                    const z = clampZoom(Number(zoomInput.value) || DEFAULT_ZOOM);
                    map.setView([pos.coords.latitude, pos.coords.longitude], z, { animate: true });
                },
                () => {},
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        document.getElementById('applyZoomBtn').addEventListener('click', applyZoomFromInput);
        document.getElementById('layerToggleBtn').addEventListener('click', () => {
            const panel = document.getElementById('layerPanel');
            const btn = document.getElementById('layerToggleBtn');
            const collapsed = panel.classList.toggle('collapsed');
            btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
        });
        zoomInput.addEventListener('keydown', e => { if (e.key === 'Enter') applyZoomFromInput(); });
        document.getElementById('zoomInBtn').addEventListener('click', () => map.zoomIn());
        document.getElementById('zoomOutBtn').addEventListener('click', () => map.zoomOut());
        document.getElementById('locBtn').addEventListener('click', getLocation);
        document.querySelectorAll('input[name="basemap"]').forEach(radio => {
            radio.addEventListener('change', e => e.target.checked && switchBase(e.target.value));
        });
        document.querySelectorAll('input[name="overlay"]').forEach(cb => {
            cb.addEventListener('change', e => toggleOverlay(e.target.value, e.target.checked));
        });
        document.getElementById('showNormalWater').addEventListener('change', () => {
            if (waterStationRecords.length) renderWaterStations({ silent: true });
        });

        map.on('zoomend', () => {
            syncInputFromMap();
            refreshMarkerClusters();
            updateMarkerLabels();
        });
        map.on('popupopen', e => {
            const btn = e.popup.getElement().querySelector('.maps-copy-btn');
            if (btn && !btn._mapsCopyBound) {
                btn._mapsCopyBound = true;
                btn.addEventListener('click', ev => {
                    ev.preventDefault();
                    copyMapsUrl(btn);
                });
            }
        });
        syncInputFromMap();
        Promise.all([
            loadWaterStations()
        ]).then(() => {
            refreshMarkerClusters();
            updateMarkerLabels();
            startPeriodicRefresh();
        });
    </script>
</body>
</html>
